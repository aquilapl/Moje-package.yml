# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : zafiro-icons
version    : 1.3
release    : 3
source     :
    - https://github.com/zayronxio/Zafiro-icons/archive/refs/tags/1.3.tar.gz : d4e81453d050ae07b157c65e388e748639a711afc1a6d1b033bdfdd90230ecb7
homepage   : https://github.com/zayronxio/Zafiro-icons
license    : GPL-3.0-or-later
component  : desktop.theme
summary    : Minimalist icon pack with flat design, focused on simplicity.
description: |
    Minimalist icons created with the flat-desing technique, utilizing washed out colors and always accompanied by white. The priority is simplicity.
install    : |
    find . -name "*β*" -delete

    install -dm755 $installdir/usr/share/icons/Zafiro-Dark
    install -dm755 $installdir/usr/share/icons/Zafiro-Light

    cp -a Dark/.  $installdir/usr/share/icons/Zafiro-Dark
    cp -a Light/. $installdir/usr/share/icons/Zafiro-Light

