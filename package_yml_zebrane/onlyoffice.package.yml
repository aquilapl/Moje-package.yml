# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : onlyoffice-desktopeditors
version    : 10.0.0
release    : 15
source     :
    - https://github.com/ONLYOFFICE/DesktopEditors/releases/download/v10.0.0/onlyoffice-desktopeditors_amd64.deb : 2190edb4022a2ac2f6eee0f78815520f0e4ece1e8a1097c645a6f9b225c8b59c
homepage   : https://www.onlyoffice.com
license    : GPL-3.0
strip      : no
component  : office
summary    : ONLYOFFICE DesktopEditors
description: |
    ONLYOFFICE DesktopEditors is an application for editing office documents (text documents, spreadsheets and presentations) from onlyoffice cloud portal on local computer without browser using.

builddeps  :
    - libglvnd
    - libx11
    - gsound
    - curl
    - wget
    - libcairo
    - libgtk-3
    - xdg-utils
    - gconf
    - libstdc++
    - at-spi2
    - libdrm
    - mesalib
    - graphicsmagick

rundeps    :
    - libglvnd
    - libx11
    - gsound
    - curl
    - wget
    - at-spi2
    - libcairo
    - libgtk-3
    - xdg-utils
    - gconf
    - libstdc++
    - mscorefonts
    - libdrm
    - mesalib
    - libnotify
    - gstreamer-plugins-base

autodep    : no

setup      : |
    ar xf $sources/onlyoffice*
    tar xf data.tar*

install    : |
    mkdir -p $installdir
    cp -R opt $installdir/opt/
    cp -R usr $installdir/usr/

    # Czyszczenie zbędnych mediów i dubli
    rm -rf $installdir/opt/onlyoffice/desktopeditors/editors/sdkjs/slide/themes/*/media
    rm -f $installdir/usr/share/applications/desktopeditors.desktop 2>/dev/null || true

    # Usuwanie pustych katalogów
    find $installdir -type d -empty -delete

    # Tworzenie wrappera ze spójnym skalowaniem CEF dla skali 1.5
    cat << 'EOF' > $installdir/usr/bin/onlyoffice-desktopeditors
    #!/bin/sh
    export QT_SCALE_FACTOR=1

    exec env LD_LIBRARY_PATH="/opt/onlyoffice/desktopeditors:/opt/onlyoffice/desktopeditors/lib:${LD_LIBRARY_PATH}" \
        /opt/onlyoffice/desktopeditors/DesktopEditors \
        --force-device-scale-factor=1.5 \
        "$@"
    EOF
    chmod +x $installdir/usr/bin/onlyoffice-desktopeditors

    %install_license usr/share/doc/onlyoffice-desktopeditors/copyright
