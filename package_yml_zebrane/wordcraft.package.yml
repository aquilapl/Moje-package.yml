name       : wordcraft
version    : 0.12.0
release    : 4
source     :
    - https://github.com/storytold/wordcraft/archive/refs/tags/v0.12.0.tar.gz : 17d4df7d0c8ba4b06b0b11b00e6e9373bc96c4274b6f01d306db05d0a274e6f3
license    :
    - MIT
    - Apache-2.0
component  : office
summary    : Open-source reimplementation of Microsoft Word in pure Rust
description: |
    WordCraft is a fast, open-source word processor with the Word workflow:
    ribbon, styles, tables, track changes, references and mail merge.
    It reads and writes .docx and runs natively.
builddeps  :
    - pkgconfig(fontconfig)
    - pkgconfig(freetype2)
    - pkgconfig(harfbuzz)
    - libxkbcommon-devel
    - pkgconfig(wayland-client)
    - pkgconfig(x11)
    - pkgconfig(xcb)
    - rust
    - cargo-c
networking : yes          # potrzebne do cargo fetch
setup      : |
    %cargo_fetch
    mkdir -p .i18n
    curl -sfL "https://github.com/storytold/craft-i18n/archive/$(cat craft-i18n.rev).tar.gz" | tar xz -C .i18n --strip-components=1
    test -d .i18n/locales
build      : |
    export CRAFT_I18N_DIR=$PWD/.i18n
    export CRAFT_I18N_REQUIRED=1
    %cargo_build -p wordcraft
install    : |
    %cargo_install wordcraft

    # .desktop
    install -Dm00644 $pkgfiles/ai.storyteller.wordcraft.desktop \
        $installdir/usr/share/applications/ai.storyteller.wordcraft.desktop

    # ikony (hicolor z upstreamu)
    install -dm00755 $installdir/usr/share/icons/hicolor
    cp -a assets/app-icon/hicolor/* $installdir/usr/share/icons/hicolor/
