# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dbusmenu-lxqt
version    : 0.3.0
release    : 2
source     :
    - https://github.com/lxqt/libdbusmenu-lxqt/releases/download/0.3.0/libdbusmenu-lxqt-0.3.0.tar.xz : ada0d14d3a4d9fb0ba344bf078d351046dfd226da1096f866d78167a79243ff9
license    : LGPL-2.1-or-later
component  : desktop.library
