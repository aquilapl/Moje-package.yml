# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : noctalia
version    : 5.0.0
release    : 9
source     :
    - https://github.com/noctalia-dev/noctalia/releases/download/v5.0.0-beta.9/noctalia-v5.0.0-beta.9.tar.gz : f1c792682c8fd80870da67bdb1da16b0d98e1256ad89ed9671a53bc4fa15013a
homepage   : https://noctalia.dev/
license    : MIT
summary    : Sleek and minimal Wayland desktop shell
description: |
    Noctalia is a native Wayland desktop shell (C++ / OpenGL ES).
    Bars, taskbar, dock, launcher, control center, notifications,
    lock screen, wallpaper and more — without Qt/GTK.

builddeps:
    - meson
    - ninja
    - pkgconf
    # Wayland / GL
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(egl)
    - pkgconfig(glesv2)
    - libglvnd-devel
    - mesalib-devel
    # rendering / text
    - pkgconfig(cairo)
    - pkgconfig(pango)
    - pkgconfig(harfbuzz)
    - pkgconfig(freetype2)
    - pkgconfig(fontconfig)
    - pkgconfig(glib-2.0)
    - pkgconfig(xkbcommon)
    # system
    - pkgconfig(libsecret-1)
    - pkgconfig(libsodium)
    - pkgconfig(sdbus-c++)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(wireplumber-0.5)
    - pkgconfig(libcurl)
    - pkgconfig(libwebp)
    - pkgconfig(libjxl)
    - pkgconfig(sndfile)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libqalculate)
    - pkgconfig(libxml-2.0)
    - pkgconfig(md4c)
    - pkgconfig(tomlplusplus)
    - pkgconfig(libical)
    - pkgconfig(pam)
    - pkgconfig(polkit-agent-1)
    - nlohmann-json
    - stb
    - jemalloc-devel

rundeps    :
    - wayland
    - sdbus-cpp
    - pipewire
    - wireplumber
    - libsecret
    - libsodium
    - libwebp
    - libjxl
    - libsndfile
    - librsvg
    - libqalculate
    - libical
    - polkit
    - pam

setup      : |
    meson setup build-release --buildtype=release --prefix=/usr

build      : |
    ninja -C build-release

install    : |
    DESTDIR=$installdir meson install -C build-release
    %install_license LICENSE
