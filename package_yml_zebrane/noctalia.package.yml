 # yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name: noctalia
version: 5.0.0
release: 8
source:
  - https://github.com/noctalia-dev/noctalia/releases/download/v5.0.0-beta.8/noctalia-v5.0.0-beta.8.tar.gz : a227af00b949e3f93ff7aece18371d10523222e63b13f48cab2255d4815d30f9
homepage: https://noctalia.dev/
license    : MIT
summary: Sleek and minimal Wayland desktop shell
description: |
  Noctalia is a native Wayland desktop shell built with Quickshell/Qt6.

builddeps:
  - meson
  - ninja
  - qt6-base-devel
  - qt6-declarative-devel
  - qt6-wayland-devel
  - wayland-devel
  - wayland-protocols-devel
  - pkgconf
  - libinput-devel
  - stb
  - tomlplusplus-devel
  - md4c-devel
  - json-c-devel
  - sdbus-cpp-devel
  - libgtk-3-devel
  - librsvg-devel 
  - pipewire-devel
  - wireplumber-devel
  - curl-devel
  - libqalculate-devel
  - nlohmann-json
  - libwebp-devel 
  - libsecret-devel
  - libsodium-devel
  - libical-devel
  - libjxl-devel
  - libsndfile-devel

rundeps:
  - qt6-base
  - qt6-wayland
  - wayland
  - sdbus-cpp

setup: |
  meson setup build-release --buildtype=release --prefix=/usr

build: |
  ninja -C build-release

install: |
  DESTDIR=$installdir meson install -C build-release
  %install_license LICENSE
