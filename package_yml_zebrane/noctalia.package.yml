name: noctalia
version: 5.0.0
release: 6
source:
  - https://github.com/noctalia-dev/noctalia/releases/download/v5.0.0-beta.7/noctalia-v5.0.0-beta.7.tar.gz : 0a6d5966ab6cb89fc0b7dfca07f8ef95b6b60d375c4110dc90382cf9071555bc
homepage: https://noctalia.dev/
license    : MIT
summary: Sleek and minimal Wayland desktop shell
description: |
  Noctalia is a native Wayland desktop shell built with Quickshell/Qt6.

builddeps:
  - meson
  - ninja
  - qt6-base-devel
  - qt6-declarative-devel
  - qt6-wayland-devel
  - wayland-devel
  - wayland-protocols-devel
  - pkgconf
  - libinput-devel
  - stb
  - tomlplusplus-devel
  - md4c-devel
  - json-c-devel
  - sdbus-cpp-devel
  - libgtk-3-devel
  - librsvg-devel 
  - pipewire-devel
  - wireplumber-devel
  - curl-devel
  - libqalculate-devel
  - nlohmann-json
  - libwebp-devel 
  - libsecret-devel
  - libsodium-devel
  - libical-devel
  - libjxl-devel
  - libsndfile-devel

rundeps:
  - qt6-base
  - qt6-wayland
  - wayland
  - sdbus-cpp

setup: |
  meson setup build-release --buildtype=release --prefix=/usr

build: |
  ninja -C build-release

install: |
  DESTDIR=$installdir meson install -C build-release
  %install_license LICENSE
