# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : sticky
version    : 1.31
release    : 2
source     :
    - https://github.com/linuxmint/sticky/archive/refs/tags/1.31.tar.gz : 2a1b45c188d1b6539d782500a23c4e71912a697e158f72b094cf41199ff576a9
homepage   : https://github.com/linuxmint/sticky
license    : GPL-2.0-or-later
component  : desktop
summary    : Sticky notes application
description: |
    Sticky is a sticky notes application developed by Linux Mint.
builddeps  :
    - pkgconfig(gtk+-3.0)
    - pkgconfig(gspell-1)
    - pkgconfig(xapp)
rundeps    :
    - python-gobject
    - python-xapp
setup      : |
    %meson_configure
build      : |
    ninja -C solusBuildDir
install    : |
    %ninja_install
