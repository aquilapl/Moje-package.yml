# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : menu-cache
version    : 1.1.0
release    : 1
source     :
    - https://downloads.sourceforge.net/lxde/menu-cache-1.1.0.tar.xz : ed02eb459dcb398f69b9fa5bf4dd813020405afc84331115469cdf7be9273ec7
license    : LGPL-2.1-or-later
component  : desktop.library
summary    : Caching mechanism for freedesktop.org compliant menus
description: |
    The menu-cache package contains a library used to speed up the manipulation of freedesktop.org compliant menus by caching them in a quick-to-access format.
builddeps  :
    - pkgconfig(glib-2.0)
    - pkgconfig(libfm-extra)
setup      : |
    # Naprawa błędów "multiple definition" dla nowszych wersji GCC
    export CFLAGS="$CFLAGS -fcommon"
    
    %configure --disable-static
build      : |
    %make
install    : |
    %make_install
