# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libfm-extra
version    : 1.3.2
release    : 2
source     :
    - https://github.com/lxde/libfm/archive/refs/tags/1.3.2.tar.gz : e65aa86650879fcd6c06983164b95409b92724482191f06472c567cbd8cf5ddd
license    : LGPL-2.1-or-later
component  : desktop.library
summary    : Extra library for libfm (required by menu-cache)
description: |
    This package contains the extra library from the libfm project, which is a strictly required dependency for menu-cache.
builddeps  :
    - pkgconfig(glib-2.0)
    - pkgconfig(gio-2.0)
    - pkgconfig(gtk-doc)
    - gettext-devel
    - autoconf
    - automake
    - libtool-devel
    - intltool
setup      : |
    ./autogen.sh
    %configure --disable-static --with-extra-only
build      : |
    %make
install    : |
    %make_install

packages   :
    - name: libfm-extra
      files:
          - /usr/lib64/libfm-extra.so.4
          - /usr/lib64/libfm-extra.so.4.*

    - name: libfm-extra-devel
      summary: Development files for libfm-extra
      description: Development files for the libfm-extra library.
      files:
          - /usr/include/
          - /usr/lib64/libfm-extra.so
          - /usr/lib64/pkgconfig/
