# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : clapper
version    : 0.10.0
release    : 3
source     :
    - https://github.com/Rafostar/clapper/archive/refs/tags/0.10.0.tar.gz : 344c0f20e540a63c6fb44cdd5de88c168ed145bb66c1307e79b2b08124780118
homepage   : https://github.com/Rafostar/clapper
license    : GPL-3.0-or-later
component  : multimedia.video
summary    : Modern media player built using GTK4 and GStreamer
description: |
    Clapper is a GNOME media player built using GTK4 toolkit and powered by GStreamer.
builddeps  :
    - pkgconfig(gtk4)
    - pkgconfig(libadwaita-1)
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(gstreamer-plugins-base-1.0)
    - pkgconfig(gstreamer-tag-1.0)
    - pkgconfig(gstreamer-video-1.0)
    - pkgconfig(graphene-gobject-1.0)
    - pkgconfig(microdns)
    - pkgconfig(libpeas-2)
    - pkgconfig(libsoup-3.0)
    - desktop-file-utils
setup      : |
    %meson_configure -Denhancers-loader=enabled
build      : |
    %ninja_build
install    : |
    %ninja_install
