# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gearlever
version    : 4.6.2
release    : 6
source     :
    - https://github.com/mijorus/gearlever/archive/refs/tags/4.6.2.tar.gz : 9f8f7a43d51e8ddcb66ee1d9aa5e6d1b9f5948c70e51be89e5bac045a01bd9ca
homepage   : https://github.com/mijorus/gearlever
license    : GPL-3.0-or-later
component  : system.utils
summary    : A modern AppImage manager
description: |
    Gearlever is a modern AppImage manager written in Python using GTK 4 and libadwaita.
builddeps  :
    - meson
    - ninja
    - python3-devel
    - libgtk-4-devel
    - libadwaita-devel
    - desktop-file-utils
    - pyxdg
    - python-gobject
rundeps    :
    - pyxdg
    - python-gobject
    - libgtk-4
    - libadwaita
    - fuse
    - fuse2
    - squashfs-tools
    - libarchive
    - python-desktop-entry-lib
    - python-ftputil
setup      : |
    meson setup builddir --prefix=/usr
build      : |
    ninja -C builddir
install    : |
    DESTDIR=$installdir ninja -C builddir install
    install -Dm00644 data/it.mijorus.gearlever.desktop.in $installdir/usr/share/applications/it.mijorus.gearlever.desktop
    cp -a data/icons/hicolor/scalable/apps/it.mijorus.gearlever.svg $installdir/usr/share/icons/hicolor/scalable/apps/
    cp -a data/icons/hicolor/symbolic/apps/it.mijorus.gearlever-symbolic.svg $installdir/usr/share/icons/hicolor/symbolic/apps/
    
    # Instalacja skryptu pomocniczego
    install -Dm00755 build-aux/get_appimage_offset.sh $installdir/usr/bin/get_appimage_offset
    %install_license COPYING
