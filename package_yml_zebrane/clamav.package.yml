# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : clamav
version    : 1.5.1
release    : 2
source     :
    - https://www.clamav.net/downloads/production/clamav-1.5.1.tar.gz : 64fe4a16a5622c1d71efe9ed7f2c2fbd37f8f237da9f11ff66b73038df71db91
license    : GPL-2.0-or-later
component  : security
summary    : Antivirus engine
description: |
    ClamAV is an open source antivirus engine for detecting trojans, viruses, malware & other malicious threats.
builddeps  :
    - bzip2-devel
    - curl-devel
    - json-c-devel
    - check-devel
    - libmspack-devel
    - libxml2-devel
    - ncurses-devel
    - openssl-devel
    - pcre2-devel
    - zlib-devel
    - cmake
    - ninja
    - rust
    - cargo-c
setup      : |
    %cmake_ninja \
        -DAPP_CONFIG_DIRECTORY=/etc/clamav \
        -DDATABASE_DIRECTORY=/var/lib/clamav \
        -DCLAMAV_USER=clamav \
        -DCLAMAV_GROUP=clamav \
        -DENABLE_SYSTEMD=ON \
        -DENABLE_MILTER=OFF \
        -DENABLE_EXAMPLES=OFF \
        -DENABLE_TESTS=OFF \
        -DBYTECODE_RUNTIME=interpreter
build      : |
    %ninja_build
install    : |
    %ninja_install
    install -dm00755 $installdir/etc/clamav
    install -m00644 etc/clamd.conf.sample $installdir/etc/clamav/clamd.conf
    install -m00644 etc/freshclam.conf.sample $installdir/etc/clamav/freshclam.conf
    sed -i 's/^Example//' $installdir/etc/clamav/clamd.conf
    sed -i 's/^Example//' $installdir/etc/clamav/freshclam.conf

    # Tworzenie katalogu bazy danych
    install -dm00755 $installdir/var/lib/clamav
    
    # Nadanie uprawnień (ypkg automatycznie mapuje to na użytkownika podczas budowania)
    chown clamav:clamav $installdir/var/lib/clamav
