# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : brave-origin
version    : 1.93.129
release    : 6
source     :
    - https://github.com/brave/brave-browser/releases/download/v1.93.129/brave-origin_1.93.129_amd64.deb : 17977aeb4b78b79d8bdbb82df1217d9ffe789662be09ea997aa95b4bce308ef5
homepage   : https://brave.com/origin/linux/
license    :
    - GPL-2.0-or-later
    - GPL-3.0-or-later
    - MPL-2.0
component  : network.web.browser
summary    : Brave Origin — uproszczona przeglądarka bez reklam i telemetrii
description: |
    Brave Origin to odchudzona wersja Brave bez Rewards, Leo AI i innych
    funkcji. Na Linuksie dostępna bezpłatnie. Może być zainstalowana
    równolegle ze zwykłym Brave.
patterns   : /*
builddeps  :
    - pkgconfig(Qt5Core)
    - pkgconfig(Qt6Core)
    - pkgconfig(alsa)
    - pkgconfig(atk)
    - pkgconfig(cups)
    - pkgconfig(gconf-2.0)
    - pkgconfig(libsecret-1)
    - pkgconfig(pango)
    - pkgconfig(xcomposite)
    - pkgconfig(xdamage)
    - pkgconfig(xkbcommon)
    - pkgconfig(xkbfile)
    - pkgconfig(xrandr)
    - pkgconfig(xscrnsaver)
rundeps    :
    - libgnome-keyring

setup      : |
    ar x ${sources}/brave-origin_${version}_amd64.deb
    tar xf data.tar.*

install    : |
    install -Ddm00755 ${installdir}

    # Kopiowanie zawartości z .deb
    cp -a usr ${installdir}/

    # Usunięcie oryginalnego symlinka
    rm -f ${installdir}/usr/bin/brave-origin-stable

    # Przeniesienie aplikacji z opt/ do /usr/share/
    install -dm00755 ${installdir}/usr/share
    cp -a opt/brave.com/brave-origin ${installdir}/usr/share/

    # Symlink do binarki
    ln -s ../share/brave-origin/brave-origin ${installdir}/usr/bin/brave-origin-stable

    # Usunięcie zbędnej dokumentacji
    rm -rf ${installdir}/usr/share/doc/brave-origin-stable

    # Metainfo (AppStream)
    install -dm00755 ${installdir}/usr/share/metainfo
    mv ${installdir}/usr/share/appdata/brave-origin.appdata.xml \
        ${installdir}/usr/share/metainfo/
    rmdir ${installdir}/usr/share/appdata

    # Instalacja pliku .desktop
    install -Dm644 usr/share/applications/brave-origin.desktop \
        ${installdir}/usr/share/applications/brave-origin.desktop

    # Instalacja ikon jednym poleceniem
    for size in 16 24 32 48 64 128 256; do
        install -Dm644 opt/brave.com/brave-origin/product_logo_${size}.png \
            ${installdir}/usr/share/icons/hicolor/${size}x${size}/apps/brave-origin.png
    done

    # Licencja
    %install_license opt/brave.com/brave-origin/LICENSE
