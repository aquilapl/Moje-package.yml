# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : klines
version    : 24.08.3
release    : 1
source     :
    - https://download.kde.org/stable/release-service/24.08.3/src/klines-24.08.3.tar.xz : 2334444e8189cd3046a202b35152b7ee9a7bbe67989b4a376dbc1537b2a778e3
homepage   : https://apps.kde.org/klines
license    : LGPL-2.1-or-later
component  : games.strategy
summary    : Kolorowe Linie – klasyczna gra w kulki
description: |
    Przesuwaj kolorowe kulki tworząc linie 5 lub więcej tego samego koloru (poziomo, pionowo, po przekątnej). Linie znikają, zdobywasz punkty.
builddeps  :
    - kf6-ki18n-devel
    - kf6-kcrash-devel
    - kf6-kconfig-devel
    - kf6-kcoreaddons-devel
    - kf6-kdbusaddons-devel
    - kf6-kdeclarative-devel
    - kf6-kguiaddons-devel
    - kf6-kiconthemes-devel
    - kf6-knotifications-devel
    - kf6-kxmlgui-devel
    - libkdegames-devel
    - qt6-svg-devel
    - extra-cmake-modules
rundeps    :
    - libkdegames
    - qt6-svg
setup      : |
    cp $pkgfiles/metal.svg $workdir/themes/metal.svg
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
