# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : brother-hl3040cn
version    : 1.1.2
release    : 1
source     :
    - https://download.brother.com/welcome/dlf005906/hl3040cncupswrapper-1.1.2-2.i386.rpm : 14ed144a277b5a38e8b5faefcdc4e3691240cf6e7033afe3e15bcca0b4cb24db
    - https://download.brother.com/welcome/dlf005904/hl3040cnlpr-1.1.2-1.i386.rpm : 4c02bef7b26e26a2183f65c4db1b5229055bd25db7996892d0ba3aff5f5fb72f
homepage   : https://global.brother
license    :
    - Distributable
    - GPL-2.0-or-later
component  : drivers.printer
extract    : no
strip      : no
summary    : Printer driver for Brother HL-3040CN
description: |
    Printer driver for Brother HL-3040CN.
    Binary portions provided for hardware enablement; standard Solus path conventions may not be fully followed.
builddeps  :
    - rpm
rundeps    :
    - cups
    - ghostscript
    - glibc-32bit
setup      : |
    # Extract RPMs
    for i in $sources/*.rpm; do
        rpm2cpio ${i} | cpio -idmv
    done
install    : |
    install -d -m 00755 $installdir

    # Kopiowanie zawartości RPM
    cp -a opt $installdir/

    # Tworzenie katalogów docelowych
    install -d -m 00755 $installdir/usr/share/cups/model
    install -d -m 00755 $installdir/usr/lib64/cups/filter

    # Kopiowanie plików PPD i filtrów do CUPS
    cp -a $installdir/opt/brother/Printers/hl3040cn/cupswrapper/brother_hl3040cn_printer_en.ppd \
          $installdir/usr/share/cups/model/
    cp -a $installdir/opt/brother/Printers/hl3040cn/cupswrapper/cupswrapperhl3040cn \
          $installdir/usr/lib64/cups/filter/brother_lpdwrapper_HL3040CN
    cp -a $installdir/opt/brother/Printers/hl3040cn/lpd/brhl3040cnfilter \
          $installdir/usr/lib64/cups/filter/
    cp -a $installdir/opt/brother/Printers/hl3040cn/lpd/filterhl3040cn \
          $installdir/usr/lib64/cups/filter/

