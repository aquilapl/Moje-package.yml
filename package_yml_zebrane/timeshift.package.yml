# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : timeshift
version    : 25.12.4
release    : 6
source     :
    - https://github.com/linuxmint/timeshift/archive/refs/tags/master.lmde7.tar.gz : e869f12364ad17149560c6c7e3cffe5b660e90663ddb6823323acd0a151c9603
license    : GPL-2.0-or-later
component  : system.utils
summary    : Creates a snapshot of the system
description: |
    Timeshift is a great tool, which monitors your system & application-level changes and gives you the ability to roll back your system in the previous state.
builddeps  :
    - pkgconfig(gee-0.8)
    - pkgconfig(xapp)
    - pkgconfig(xkbfile)
    - pkgconfig(libgnomekbd)
    - libvte-devel
    - libjson-glib-devel
    - meson
    - vala
    - help2man 
    - gettext
rundeps    :    
    - rsync
setup      : |
    # Usuń zależność od crontab i run-parts (używamy tylko GUI, bez harmonogramu)
    sed -i 's/"crontab",//' src/Core/Main.vala
    sed -i 's/, "run-parts"//' src/Core/Main.vala
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license debian/copyright
