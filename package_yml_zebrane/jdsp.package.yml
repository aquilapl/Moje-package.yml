# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : jamesdsp
version    : 2.7.0
release    : 1
source     :
    - https://github.com/Audio4Linux/JDSP4Linux/archive/refs/tags/2.7.0.tar.gz : 9acbc0e67fe94ecfa770b007c1d70a3efcf267be355fb15cd0ca6a307a479bc5
license    : GPL-3.0-or-later
component  : multimedia.audio
summary    : Audio DSP for Linux (PipeWire)
description: |
    JamesDSP for Linux is an open-source sound effects engine for PipeWire and PulseAudio.

builddeps  :
    - pkgconfig(Qt6Widgets)
    - pkgconfig(Qt6Svg)
    - pkgconfig(Qt6Core)
    - pkgconfig(glibmm-2.4)
    - pkgconfig(libarchive)
    - pipewire-devel
    - llvm-clang
    - qt6-base-devel

environment: |
    # Wyłącz traktowanie ostrzeżeń jako błędów
    export CFLAGS="${CFLAGS} -Wno-error"
    export CXXFLAGS="${CXXFLAGS} -Wno-error -fpermissive"

setup      : |
    # podmiana ikony przed kompilacją
    install -Dm0644 $pkgfiles/jamesdsp-tray.svg resources/icons/jamesdsp-tray.svg
    %patch -p1 -i $pkgfiles/crossfeed-clang-fix.patch

build      : |
    # Kompilacja z Qt6
    qmake6 PREFIX=/usr JDSP4Linux.pro
    %make

install    : |
    %make_install

    # instalacja desktop
    install -Dm0644 $pkgfiles/jamesdsp.desktop $installdir/usr/share/applications/jamesdsp.desktop
