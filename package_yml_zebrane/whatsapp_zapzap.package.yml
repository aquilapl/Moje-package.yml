# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name    : zapzap
version : 7.4.4
release : 7
source  :
    - https://github.com/rafatosta/zapzap/archive/refs/tags/7.4.4.tar.gz : f51e1ef2564d2af8070105220b5325204b285d0c306db7db55db63b4bcb53eee
homepage: https://github.com/rafatosta/zapzap
license : GPL-3.0-or-later
component: network.im
summary : Desktop client for WhatsApp Web
description: |
    Desktop client for WhatsApp Web built with Python and PyQt6-WebEngine.

builddeps:
    - python-build
    - python-installer
    - python-wheel
    - python-pyqt6-webengine

rundeps:
    - python-pyqt6-webengine
    - python-pydantic
    - python-typing-extensions
    - python-inflect
    - python-jaraco.text

build: |
     python -m build --wheel --no-isolation

install: |
    python -m installer --destdir=$installdir dist/*.whl

    install -Dm644 share/applications/com.rtosta.zapzap.desktop \
        $installdir/usr/share/applications/com.rtosta.zapzap.desktop

    install -Dm644 share/icons/com.rtosta.zapzap.svg \
        $installdir/usr/share/icons/hicolor/scalable/apps/com.rtosta.zapzap.svg

    install -Dm644 share/metainfo/com.rtosta.zapzap.appdata.xml \
        $installdir/usr/share/metainfo/com.rtosta.zapzap.appdata.xml
    %install_license LICENSE
