# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : lxqt-themes
version    : 2.2.0
release    : 1
source     :
    - https://github.com/lxqt/lxqt-themes/archive/refs/tags/2.2.0.tar.gz : 589e7149b8c99d3226f6e82d8cad370c07dc6531641558ac1fdd7f101d257d9e 
license    : LGPL-2.1-or-later
component  : desktop.library
summary    : Themes, graphics and icons for LXQt
description: |
    lxqt-themes contains the official themes, wallpapers and icons for the LXQt desktop environment.
builddeps  :
    - lxqt-build-tools-devel
    - cmake
    - ninja
setup      : |
    mkdir build
    cd build
    cmake .. -G Ninja \
        -DCMAKE_INSTALL_PREFIX=/usr
build      : |
    cd build
    ninja
install    : |
    cd build
    DESTDIR=%installroot% ninja install
