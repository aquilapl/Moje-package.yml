name: megasync
version: 6.7.0
release: 7
source:
  - https://mega.nz/linux/repo/xUbuntu_26.10/amd64/megasync_6.7.0-2.1_amd64.deb: 14d70c5efb701ac3aa8c8087d9053b179f956a4c8ecd8a1b3c3400cc65cfc44b
license    : © MEGA 2020 All rights reserved
strip: no
component: network.clients
summary: Sync your files to your Mega account.
description: |
  Easy automated syncing between your computers and your MEGA cloud drive
builddeps:
  - pkgconfig(gl)
  - pkgconfig(libcares)
  - pkgconfig(libcurl)
  - pkgconfig(libmediainfo)
  - pkgconfig(libsodium)
  - pkgconfig(libuv)
  - pkgconfig(Qt5Core)
  - pkgconfig(Qt5Svg)
  - pkgconfig(Qt5UiTools)
  - pkgconfig(Qt5WaylandClient)
  - pkgconfig(sqlite3)
  - pkgconfig(zlib)
  - libicu-devel
  - cryptopp-devel
rundeps:
  - cryptopp
  - libicu
  - freeimage
  - libsodium
  - libraw
  - libraw-utils
  - qt5-x11extras
  - qt5-wayland
  - qt5-base
  - qt5-declarative
  - qt5-graphicaleffects
  - qt5-quickcontrols
  - qt5-quickcontrols2
setup: |
  ar xf $sources/megasync*
  tar xf data.tar*
install: |
  mkdir -p $installdir
  cp -R etc $installdir/etc/
  cp -R usr $installdir/usr/
  cp -R opt $installdir/opt/

  
