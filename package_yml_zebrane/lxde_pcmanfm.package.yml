# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pcmanfm
version    : 1.3.2
release    : 2
source     :
    - https://github.com/lxde/pcmanfm/archive/refs/tags/1.3.2.tar.gz : 66ee6b1a5907bb519d5b175e379f975acfcdaa68b6cbbc72d168b3ff935e6fea
license    : GPL-2.0-or-later
component  : desktop.lxde
summary    : Extremely fast and lightweight file manager (GTK2 version)
description: |
    PCManFM is the standard file manager for LXDE. This is the classic GTK2 version.
builddeps  :
    - pkgconfig(gtk+-2.0)
    - pkgconfig(libfm)
    - libgtk-2-devel
    - libfm-devel
    - intltool
    - autoconf
    - automake
    - libtool
setup      : |
    sed -i 's/return g_object_ref(item);/return ATK_OBJECT(g_object_ref(item));/g' src/desktop.c
    ./autogen.sh
    %configure --sysconfdir=/etc \
               --with-gtk=2 \
               --disable-static
build      : |
    export CFLAGS="$CFLAGS -fcommon -Wno-error=deprecated-declarations -Wno-error=incompatible-pointer-types"
    %make
install    : |
    %make_install
